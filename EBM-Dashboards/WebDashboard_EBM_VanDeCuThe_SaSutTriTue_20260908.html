<!DOCTYPE html>
<html lang="vi">
<!--
==================================================================================
  TEMPLATE CHUẨN — "EVIDENCE WORKBENCH"  (Mẫu mặc định cho Dashboard lâm sàng EBM)
  Dùng cho: skill cap-nhat-chung-cu-y-khoa và mọi tác vụ tạo Web Dashboard lâm sàng.
----------------------------------------------------------------------------------
  CÁCH DÙNG (chỉ cần sửa 1 chỗ): thay khối hằng số DATA = {...} ở cuối file bằng
  nội dung đã XÁC MINH của vấn đề lâm sàng. KHÔNG cần đụng HTML/CSS.

  3 LỚP NỘI DUNG BẮT BUỘC (đã ánh xạ sẵn vào bố cục 3 cột):
    • Lớp 1 — CLINICAL QUICK VIEW  → băng tóm tắt trên + tab mặc định + bảng item
    • Lớp 2 — EVIDENCE DETAIL VIEW → panel phải (mở khi click một item)
    • Lớp 3 — SAFETY / LIMITS / VN → các tab riêng

  QUY TẮC LIÊM CHÍNH (theo skill):
    • Chỉ hiển thị nội dung đã xác minh; số liệu/hiệu số trích ĐÚNG như nguồn.
    • Giữ nguyên grading của nguồn; nếu không có ghi "Nguồn không cung cấp phân hạng".
    • Mã item là cục bộ ITEM-01… (KHÔNG phải ID Dashboard Master).
    • Mọi đầu ra kèm nguồn (PMID/DOI/ngày) + disclaimer "Cần bác sĩ kiểm chứng".
    • KHÔNG lưu thông tin định danh bệnh nhân (PII).
==================================================================================
-->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard EBM · [TÊN VẤN ĐỀ]</title>
<style>
  :root{
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9;
    --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --faint:#94a3b8;
    --line:#e2e8f0; --line-2:#cbd5e1;
    --primary:#0e7490; --primary-2:#0891b2; --accent:#2563eb;
    /* semantic theo quyết định thực hành */
    --apply:#16a34a;   /* Áp dụng ngay   */
    --consider:#ca8a04;/* Cân nhắc       */
    --notyet:#ea580c;  /* Chưa đủ thay đổi*/
    --danger:#dc2626;  /* Cờ đỏ          */
    --g-high:#16a34a; --g-mod:#ca8a04; --g-low:#ea580c; --g-vlow:#dc2626;
    --rct:#2563eb; --meta:#7c3aed; --cohort:#0891b2; --guideline:#059669; --consensus:#db2777;
    --mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:2px solid var(--surface)}
  a{color:var(--accent);text-decoration:none}

  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ---------- TOP BAR ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:20}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px;white-space:nowrap}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff;font-size:14px}
  .qtitle{flex:1;min-width:0}
  .qtitle .lbl{font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--primary)}
  .qtitle h1{font-size:15px;letter-spacing:-.2px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pico-bar{display:flex;align-items:center;gap:6px}
  .pico-chip{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
  .pico-chip b{font-size:9px;color:#fff;background:var(--primary);border-radius:4px;padding:1px 5px;letter-spacing:.3px}
  .pico-chip.i b{background:var(--accent)} .pico-chip.c b{background:var(--muted)} .pico-chip.o b{background:#0d9488}
  .search{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;width:230px}
  .search input{border:0;background:transparent;outline:none;font-size:12px;flex:1;font-family:var(--sans)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{background:var(--surface-3)}
  .btn.pri{background:var(--primary);color:#fff;border-color:var(--primary)} .btn.pri:hover{background:#0b5e74}

  /* ---------- CLINICAL QUICK VIEW summary band ---------- */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .scard{background:var(--surface);padding:10px 14px;max-height:188px;overflow:auto}
  .scard .sh{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .scard .sh .ic{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:10px}
  .scard.concl .sh{color:var(--primary)} .scard.concl .ic{background:var(--primary)}
  .scard.do .sh{color:var(--apply)} .scard.do .ic{background:var(--apply)}
  .scard.dont .sh{color:var(--notyet)} .scard.dont .ic{background:var(--notyet)}
  .scard.flag .sh{color:var(--danger)} .scard.flag .ic{background:var(--danger)}
  .scard p{font-size:12px;color:var(--ink-2);line-height:1.45}
  .scard ul{list-style:none;display:flex;flex-direction:column;gap:3px}
  .scard li{font-size:11.5px;color:var(--ink-2);display:flex;gap:6px;line-height:1.4}
  .scard li::before{content:"▪";color:var(--faint);flex-shrink:0}
  .scard.flag li::before{content:"⚑";color:var(--danger)}

  /* ---------- GRADE Evidence-to-Decision ---------- */
  .etd{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .etd .eh{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--meta);margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .etd .eh .note{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;font-size:10.5px}
  .etd-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line)}
  .etd-c{background:var(--surface);padding:7px 11px}
  .etd-c .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;display:flex;gap:5px;align-items:center}
  .etd-c .l .src{font-size:8.5px;color:#0d9488;border:1px solid var(--line);border-radius:3px;padding:0 4px;text-transform:none}
  .etd-c .l .op{font-size:8.5px;color:#b45309;border:1px solid var(--line);border-radius:3px;padding:0 4px;text-transform:none}
  .etd-c .v{font-size:11.5px;color:var(--ink-2);line-height:1.45;margin-top:3px}
  .etd-rec{margin-top:10px;background:linear-gradient(135deg,#ecfdf5,#eff6ff);border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px}
  .etd-rec .rh{font-size:10.5px;font-weight:700;color:var(--apply);text-transform:uppercase;letter-spacing:.5px;display:flex;gap:8px;align-items:center;margin-bottom:4px}
  .etd-rec .rh .str{font-size:9px;color:#fff;background:var(--apply);border-radius:4px;padding:1px 8px}
  .etd-rec .rv{font-size:12.5px;color:var(--ink);line-height:1.5}

  /* ---------- KPI strip ---------- */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .kpi{background:var(--surface);padding:8px 14px}
  .kpi .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .kpi .val{font-size:20px;font-weight:700;font-family:var(--mono);line-height:1.15}
  .kpi .sub{font-size:10px;color:var(--faint)}
  .kpi .val.apply{color:var(--apply)} .kpi .val.consider{color:var(--consider)} .kpi .val.notyet{color:var(--notyet)}

  /* ---------- BODY ---------- */
  .body{flex:1;display:grid;grid-template-columns:clamp(200px,15vw,236px) minmax(0,1fr) clamp(340px,26vw,430px);overflow:hidden;position:relative}
  .rail,.center-scroll,.detail{overflow:auto}
  .rail{background:var(--surface);border-right:1px solid var(--line);padding:12px 12px 28px}
  .center{display:flex;flex-direction:column;background:var(--bg);overflow:hidden;min-width:0}
  .detail{background:var(--surface);border-left:1px solid var(--line);position:relative}
  .scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:40}
  .detail-close{display:none;position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:15px;cursor:pointer;place-items:center;z-index:6}
  .detail-close:hover{background:var(--surface-3)}

  /* facets */
  .facet{margin-bottom:16px}
  .facet h4{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between;font-weight:700}
  .facet h4 .clr{color:var(--accent);cursor:pointer;font-size:10px;text-transform:none}
  .opt{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;cursor:pointer;user-select:none}
  .opt:hover{background:var(--surface-3)} .opt.on{background:#ecfeff}
  .opt .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:10px}
  .opt.on .box{background:var(--primary);border-color:var(--primary)}
  .opt .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .opt .nm{flex:1;font-size:12px;color:var(--ink-2)}
  .opt .ct{font-size:10px;color:var(--faint);font-family:var(--mono);background:var(--surface-3);padding:1px 6px;border-radius:10px}
  .opt.on .ct{background:#cffafe;color:#0e7490}

  /* tabs */
  .tabs{display:flex;gap:2px;padding:8px 14px 0;background:var(--surface);border-bottom:1px solid var(--line)}
  .tab{border:0;background:transparent;padding:8px 13px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--primary);border-bottom-color:var(--primary)}
  .tab .badge-n{font-size:10px;font-family:var(--mono);background:var(--surface-3);border-radius:10px;padding:0 6px}
  .center-scroll{flex:1;padding:0 0 40px}
  .ctoolbar{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--bg);z-index:4;border-bottom:1px solid var(--line)}
  .ctoolbar b{color:var(--ink)} .ctoolbar .sp{flex:1}

  /* table */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
  thead th{position:sticky;top:39px;background:var(--surface-2);text-align:left;padding:9px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;z-index:3}
  thead th:hover{color:var(--ink)}
  tbody tr{cursor:pointer;border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#f0fdff}
  tbody tr.sel{background:#ecfeff;box-shadow:inset 3px 0 0 var(--primary)}
  tbody td{padding:11px 14px;vertical-align:top;border-bottom:1px solid var(--line)}
  tbody td:first-child{min-width:240px}
  tbody td:not(:first-child){white-space:nowrap}
  .ttl{font-weight:600;color:var(--ink);line-height:1.35;display:block;max-width:520px}
  .ttl .auth{font-weight:400;color:var(--muted);font-size:11px;margin-top:2px;display:block}
  .pmid{font-family:var(--mono);font-size:10px;color:var(--accent)}
  .idtag{font-family:var(--mono);font-size:9.5px;color:var(--faint)}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .badge .d{width:7px;height:7px;border-radius:50%}
  .b-rct{background:#eff6ff;color:var(--rct)}.b-rct .d{background:var(--rct)}
  .b-meta{background:#f5f3ff;color:var(--meta)}.b-meta .d{background:var(--meta)}
  .b-cohort{background:#ecfeff;color:var(--cohort)}.b-cohort .d{background:var(--cohort)}
  .b-guideline{background:#ecfdf5;color:var(--guideline)}.b-guideline .d{background:var(--guideline)}
  .b-consensus{background:#fdf2f8;color:var(--consensus)}.b-consensus .d{background:var(--consensus)}

  .dec{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px}
  .dec .d{width:7px;height:7px;border-radius:50%}
  .d-apply{background:#dcfce7;color:var(--apply)}.d-apply .d{background:var(--apply)}
  .d-consider{background:#fef9c3;color:var(--consider)}.d-consider .d{background:var(--consider)}
  .d-notyet{background:#ffedd5;color:var(--notyet)}.d-notyet .d{background:var(--notyet)}

  .grade{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
  .grade .pips{display:flex;gap:2px}.grade .pip{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25}.grade .pip.on{opacity:1}
  .g-high{background:#dcfce7;color:var(--g-high)}.g-mod{background:#fef9c3;color:var(--g-mod)}.g-low{background:#ffedd5;color:var(--g-low)}.g-vlow{background:#fee2e2;color:var(--g-vlow)}.g-na{background:var(--surface-3);color:var(--muted)}
  .effect{font-family:var(--mono);font-weight:600}.effect.fav{color:var(--g-high)}.effect.harm{color:var(--g-vlow)}.effect.ns{color:var(--muted)}
  .ci{color:var(--faint);font-size:10px;font-family:var(--mono)}
  .mforest svg{display:block}
  .flag-mini{display:inline-block;font-size:9px;font-weight:700;color:var(--notyet);background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;padding:1px 5px;margin-top:4px}

  /* generic section cards used in non-table tabs */
  .pad{padding:14px 16px}
  .cardlist{display:flex;flex-direction:column;gap:10px}
  .li-card{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--surface)}
  .li-card .h{font-weight:700;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .li-card .x{font-size:12px;color:var(--ink-2);line-height:1.5}
  .li-card .src{font-size:10.5px;color:var(--muted);margin-top:6px}
  .stripe{width:4px;align-self:stretch;border-radius:3px}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  .vn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .vn-col h5{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
  .needconf{display:inline-block;font-size:9.5px;font-weight:700;color:#b45309;background:#fef3c7;border:1px solid #fcd34d;border-radius:5px;padding:1px 6px}

  /* RoB 2 — chỉ dùng cho RCT */
  .robmini{display:flex;gap:3px}
  .robmini i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .robfull{display:flex;flex-direction:column;gap:6px}
  .robfull .r{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
  .robfull .r i{width:15px;height:15px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:800;color:#fff}
  .rl{background:var(--g-high)}.rs{background:var(--g-mod)}.rh{background:var(--g-vlow)}
  .efftext{font-size:10.5px;color:var(--ink-2);line-height:1.35;display:block;max-width:230px}

  /* verify tasks */
  .vtask{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface)}
  .vtask .n{width:24px;height:24px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0;font-family:var(--mono)}
  .vtask .t{font-size:12.5px;color:var(--ink);font-weight:600}
  .vtask .g{font-size:11px;color:var(--muted);margin-top:2px}
  .vtask .timer{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--primary);background:#ecfeff;border-radius:6px;padding:3px 8px;font-weight:700;white-space:nowrap}

  /* ---------- DETAIL PANEL (Evidence Detail View) ---------- */
  .detail .dhead{padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
  .detail .deyebrow{font-size:10px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .detail h2{font-size:14.5px;line-height:1.3}
  .detail .dmeta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .dsec{padding:13px 16px;border-bottom:1px solid var(--line)}
  .dsec h3{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:9px;font-weight:700;display:flex;align-items:center;gap:6px}
  .picogrid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12px}
  .picogrid .k{font-weight:700;color:#fff;font-size:9px;border-radius:4px;padding:2px 6px;text-align:center;align-self:start}
  .picogrid .kP{background:var(--primary)}.picogrid .kI{background:var(--accent)}.picogrid .kC{background:var(--muted)}.picogrid .kO{background:#0d9488}
  .picogrid .v{color:var(--ink-2)}.picogrid .v .match{color:var(--g-high);font-weight:600;font-size:10px}.picogrid .v .mis{color:var(--notyet);font-weight:600;font-size:10px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
  .stat .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .stat .n{font-size:17px;font-weight:700;font-family:var(--mono);margin-top:1px}
  .stat .x{font-size:10px;color:var(--faint)}
  .kvline{display:flex;flex-direction:column;gap:9px}
  .kvline .r{display:grid;grid-template-columns:96px 1fr;gap:9px;font-size:12px;align-items:start}
  .kvline .r .k{color:var(--muted);font-weight:600;font-size:11px}
  .kvline .r .v{color:var(--ink-2)}
  .applybox{background:linear-gradient(135deg,#ecfeff,#eff6ff);border:1px solid #bae6fd;border-radius:10px;padding:11px}
  .applybox .ah{font-size:11px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .applybox p{font-size:12px;color:var(--ink-2);line-height:1.5}
  .src{display:flex;flex-direction:column;gap:6px}
  .src a{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
  .src a:hover{border-color:var(--primary-2);background:#fff}
  .src .tag{font-family:var(--mono);font-size:10px;color:#fff;border-radius:4px;padding:1px 5px}
  .src .tag.doi{background:var(--accent)}.src .tag.pmid{background:var(--g-high)}.src .tag.url{background:var(--ink-2)}
  .reflist{font-size:11px;color:var(--ink-2);line-height:1.5;display:flex;flex-direction:column;gap:5px}
  .reflist .r{padding-left:14px;text-indent:-14px}

  /* ---------- DISCLAIMER ---------- */
  .disclaimer{display:flex;align-items:center;gap:10px;padding:8px 16px;background:#fffbeb;border-top:1px solid #fde68a;font-size:11.5px;color:#92400e}
  .disclaimer b{font-weight:700}
  .disclaimer .upd{margin-left:auto;color:#b45309;font-family:var(--mono);font-size:10.5px}
  .hidden{display:none!important}

  /* ===================== RESPONSIVE — cân đối khi màn hẹp ===================== */

  @media (min-width:1200px) and (max-width:1460px){

  }

  @media (max-width:820px){

  @media (max-width:540px){

     action:'Áp dụng 3 bước cốt lõi: (1) xác nhận có suy giảm nhận thức và/hoặc chức năng bằng thông tin từ người thân kèm test nhận thức ngắn; (2) mô tả hội chứng nhận thức–hành vi (trí nhớ, ngôn ngữ, thị giác–không gian, điều hành, hành vi); (3) truy tìm bệnh nền và các yếu tố góp phần có thể hồi phục TRƯỚC khi gán nhãn sa sút trí tuệ. Công bố chẩn đoán cho cặp bệnh nhân–người chăm sóc và lập kế hoạch chăm sóc.',
     monitoring:'Đánh giá lại nhận thức, chức năng và gánh nặng người chăm sóc mỗi 3–6 tháng; rà đơn thuốc mỗi lần khám.',
     vn:'Triển khai được NGAY bằng nguồn lực phòng khám: bệnh sử có người thân, MMSE hoặc MoCA tiếng Việt, xét nghiệm cơ bản, hình ảnh học sọ não. [CẦN XÁC NHẬN TẠI ĐƠN VỊ] công cụ nhận thức nào đã chuẩn hoá và được dùng thống nhất, và quy trình chuyển tuyến.',
     references:['Atri A, Dickerson BC, Clevenger C, và cộng sự. Alzheimer’s Association clinical practice guideline for the Diagnostic Evaluation, Testing, Counseling, and Disclosure of Suspected Alzheimer’s Disease and Related Disorders (DETeCD-ADRD): Executive summary of recommendations for primary care. Alzheimers Dement. 2025;21(6):e14333. PMID 39713942.']},

    {id:'ITEM-02', title:'Khi nào chuyển chuyên khoa và làm gì ở tuyến chuyên khoa (DETeCD-ADRD)',
     source:'Hướng dẫn thực hành lâm sàng DETeCD-ADRD — bản tóm tắt cho tuyến chuyên khoa', org:'Alzheimer Association (Hoa Kỳ)', dateVersion:'2024/2025 · Alzheimers Dement 2025;21(1):e14337',
     pmid:'39713957', doi:'10.1002/alz.14337', design:'Guideline',
     population:'Bệnh nhân nghi Alzheimer hoặc sa sút trí tuệ liên quan, đánh giá tại tuyến chuyên khoa',
     pico:{P:['Chẩn đoán chưa rõ sau đánh giá cốt lõi','match'],I:['Đánh giá chuyên sâu: thần kinh–tâm lý, hình ảnh học chuyên biệt, dấu ấn sinh học','match'],C:['Chỉ đánh giá cốt lõi tại tuyến ban đầu','match'],O:['Xác định nguyên nhân nền, công bố chẩn đoán và kế hoạch chăm sóc tối ưu','match']},
     gradeSource:'Guideline dựa trên cùng quy trình tổng quan hệ thống và Delphi cải biên; nguồn KHÔNG cung cấp phân hạng GRADE',
     gradeLevel:'na', decision:'apply', groups:['cao-tuoi'], flag:'Danh sách ngưỡng chuyển tuyến bên dưới = đánh giá vận hành',
     action:'Chuyển chuyên khoa thần kinh, lão khoa hoặc phòng khám trí nhớ khi (đánh giá vận hành, phù hợp với tinh thần guideline): khởi phát trước 65 tuổi; tiến triển nhanh bất thường; hội chứng không điển hình (ngôn ngữ, thị giác–không gian, hành vi–nhân cách); có dấu thần kinh khu trú, co giật hoặc rối loạn vận động; nghi nguyên nhân hiếm hoặc có thể điều trị đặc hiệu; chẩn đoán vẫn không chắc chắn sau đánh giá cốt lõi; hoặc cần dấu ấn sinh học, thần kinh–tâm lý chuyên sâu.',
     monitoring:'Sau khi chuyên khoa xác lập chẩn đoán, tuyến ban đầu tiếp tục theo dõi thuốc, chức năng, an toàn và hỗ trợ người chăm sóc.',
     vn:'Xây danh sách địa chỉ chuyển tuyến cụ thể (thần kinh, lão khoa, tâm thần) và tiêu chí chuyển tuyến thành văn bản của phòng khám. [CẦN XÁC NHẬN TẠI ĐƠN VỊ] năng lực MRI, thần kinh–tâm lý và thời gian chờ.',
     references:['Dickerson BC, Atri A, Clevenger C, và cộng sự. DETeCD-ADRD: Executive summary of recommendations for specialty care. Alzheimers Dement. 2025;21(1):e14337. PMID 39713957.']},

    {id:'ITEM-03', title:'Tiêu chuẩn chẩn đoán và phân giai đoạn Alzheimer sửa đổi 2024 — chẩn đoán SINH HỌC',
     source:'Revised criteria for diagnosis and staging of Alzheimer’s disease: Alzheimer’s Association Workgroup', org:'Alzheimer Association (Hoa Kỳ) · National Institute on Aging', dateVersion:'2024 · Alzheimers Dement 2024;20(8):5143-5169',
     pmid:'38934362', doi:'10.1002/alz.13859', design:'Guideline',
     population:'Toàn bộ phổ Alzheimer, từ giai đoạn tiền lâm sàng đến sa sút trí tuệ',
     pico:{P:['Người có hoặc chưa có triệu chứng nhận thức','match'],I:['Định nghĩa Alzheimer theo sinh học: dấu ấn Core 1 bất thường (PET amyloid, dấu ấn dịch não tuỷ được phê duyệt, dấu ấn huyết tương chính xác — đặc biệt p-tau217)','match'],C:['Định nghĩa theo hội chứng lâm sàng','match'],O:['Chẩn đoán và phân giai đoạn Alzheimer thống nhất giữa nghiên cứu và lâm sàng','match']},
     gradeSource:'Tài liệu tiêu chuẩn/khung khái niệm của nhóm công tác; nguồn KHÔNG cung cấp phân hạng GRADE và tự nêu rõ đây KHÔNG phải hướng dẫn quy trình thực hành từng bước',
     gradeLevel:'na', decision:'consider', groups:['cao-tuoi'], flag:'Chẩn đoán sinh học — chưa khả thi rộng tại Việt Nam',
     action:'Hiểu đúng nguyên tắc: một dấu ấn Core 1 bất thường đủ để xác lập chẩn đoán Alzheimer về mặt sinh học; Core 2 (tau PET, dấu ấn muộn) cho thông tin tiên lượng. KHÔNG dùng tài liệu này như quy trình khám bệnh, và KHÔNG chuyển thành chỉ định xét nghiệm đại trà.',
     monitoring:'Nếu bệnh nhân được làm dấu ấn sinh học ở nơi khác, đọc kết quả trong bối cảnh lâm sàng và xác suất tiền nghiệm, không diễn giải đơn độc.',
     vn:'Chưa áp dụng thường quy tại ngoại trú Việt Nam: PET amyloid và tau, xét nghiệm dịch não tuỷ chuẩn hoá gần như không sẵn có; dấu ấn huyết tương chưa triển khai rộng. Ở tuyến ngoại trú, chẩn đoán vẫn dựa trên hội chứng lâm sàng kèm loại trừ nguyên nhân khác. [CẦN XÁC NHẬN TẠI ĐƠN VỊ]',
     references:['Jack CR Jr, Andrews JS, Beach TG, và cộng sự. Revised criteria for diagnosis and staging of Alzheimer’s disease: Alzheimer’s Association Workgroup. Alzheimers Dement. 2024;20(8):5143-5169. PMID 38934362.']},

    {id:'ITEM-04', title:'Hướng dẫn đầu tiên về dấu ấn sinh học MÁU trong chẩn đoán Alzheimer (chỉ ở chuyên khoa)',
     source:'Alzheimer’s Association Clinical Practice Guideline on the use of blood-based biomarkers', org:'Alzheimer Association (Hoa Kỳ)', dateVersion:'2025 · Alzheimers Dement 2025;21(7):e70535',
     pmid:'40729527', doi:'10.1002/alz.70535', design:'Guideline',
     population:'Người có suy giảm nhận thức KHÁCH QUAN (MCI hoặc sa sút trí tuệ) được đánh giá tại cơ sở chuyên khoa rối loạn trí nhớ',
     frame:'Chẩn đoán (PIRT)', frameLabels:{P:'P',I:'Index test',C:'Chuẩn tham chiếu',O:'Độ chính xác'},
     pico:{P:['MCI hoặc sa sút trí tuệ tại chuyên khoa trí nhớ','match'],I:['Xét nghiệm máu p-tau217, %p-tau217, p-tau181, p-tau231, tỷ số Aβ42/Aβ40','match'],C:['Dấu ấn dịch não tuỷ, PET amyloid hoặc giải phẫu bệnh','match'],O:['Độ nhạy, độ đặc hiệu, xác suất hậu nghiệm của bệnh học Alzheimer','match']},
     effectText:'Ngưỡng khuyến cáo: dùng làm test phân loại khi Sn ≥90% và Sp ≥75%; thay PET/dịch não tuỷ khi Sn VÀ Sp đều ≥90%',
     gradeSource:'Hội đồng áp dụng GRADE và khung Evidence-to-Decision; khuyến cáo dựa trên NGƯỠNG HIỆU NĂNG, không gắn với thương hiệu. Độ chắc chắn chứng cứ của các test dao động từ trung bình đến rất thấp',
     gradeLevel:'na', decision:'consider', groups:['cao-tuoi'],
     action:'Hai khuyến cáo cốt lõi: (1) test máu có độ nhạy ≥90% và độ đặc hiệu ≥75% có thể dùng làm test PHÂN LOẠI ban đầu (triaging); (2) test có độ nhạy VÀ độ đặc hiệu đều ≥90% có thể THAY THẾ PET amyloid hoặc xét nghiệm dịch não tuỷ. Hội đồng cảnh báo nhiều test thương mại KHÔNG đạt các ngưỡng này, nhất là khi dùng một điểm cắt duy nhất; test không thay thế đánh giá lâm sàng toàn diện và phải cân nhắc xác suất tiền nghiệm.',
     monitoring:'Nếu dùng, phải biết rõ hiệu năng của ĐÚNG loại test và nền tảng xét nghiệm đang dùng; diễn giải cùng bệnh cảnh.',
     vn:'Chưa sẵn có thường quy tại Việt Nam và chưa có khuyến cáo dùng ở tuyến ban đầu. Nếu có triển khai trong tương lai: chỉ dùng cho người có suy giảm nhận thức khách quan, tại cơ sở chuyên khoa, và phải công bố hiệu năng của test cụ thể. [CẦN XÁC NHẬN TẠI ĐƠN VỊ]',
     safety:'Rủi ro chính là dùng SAI bối cảnh: xét nghiệm cho người không có suy giảm nhận thức khách quan, hoặc dùng test chưa đạt ngưỡng hiệu năng, sẽ tạo ra nhiều kết quả dương tính giả và gán nhãn bệnh sai.',
     references:['Palmqvist S, Whitson HE, Allen LA, và cộng sự. Alzheimer’s Association Clinical Practice Guideline on the use of blood-based biomarkers in the diagnostic workup of suspected Alzheimer’s disease within specialized care settings. Alzheimers Dement. 2025;21(7):e70535. PMID 40729527.']},

    {id:'ITEM-05', title:'Độ chính xác của dấu ấn sinh học máu — biến thiên RẤT lớn giữa các test',
     source:'Blood-based biomarkers for detecting Alzheimer’s disease pathology: systematic review and meta-analysis', org:'Alzheimers Dement', dateVersion:'2025 · Alzheimers Dement 2025;21(11):e70828',
     pmid:'41193403', doi:'10.1002/alz.70828', design:'Meta',
     population:'49 nghiên cứu quan sát, 31 loại test dấu ấn máu, ở người có suy giảm nhận thức tại cơ sở chuyên khoa',
     frame:'Chẩn đoán (PIRT)', frameLabels:{P:'P',I:'Index test',C:'Chuẩn tham chiếu',O:'Độ chính xác'},
     pico:{P:['Người có suy giảm nhận thức tại chuyên khoa','match'],I:['31 test dấu ấn máu khác nhau (p-tau, Aβ)','match'],C:['Dịch não tuỷ, PET amyloid, giải phẫu bệnh','match'],O:['Độ nhạy gộp 49,3%–91,4%; độ đặc hiệu gộp 61,5%–96,7%','match']},
     effectText:'Độ nhạy gộp 49,3%–91,4% · độ đặc hiệu gộp 61,5%–96,7% (khi dùng một điểm cắt)',
     gradeSource:'Độ chắc chắn chứng cứ theo GRADE: TRUNG BÌNH đến RẤT THẤP; phần lớn nghiên cứu có nguy cơ sai lệch cao (chọn bệnh nhân, thực hiện index test, chuẩn tham chiếu) theo QUADAS-2',
     gradeLevel:'low', decision:'consider', groups:['cao-tuoi'], flag:'Hiệu năng phụ thuộc test và nền tảng xét nghiệm',
     action:'Hiệu số nguồn: độ nhạy gộp dao động 49,3% (95% CI 41,2–57,4) đến 91,4% (86,6–94,6); độ đặc hiệu gộp 61,5% (45,6–75,3) đến 96,7% (87,8–99,2) khi dùng MỘT điểm cắt. Hệ quả thực hành: không thể nói chung chung “xét nghiệm máu chẩn đoán Alzheimer”; phải hỏi rõ đó là test nào, nền tảng nào, hiệu năng công bố ra sao.',
     monitoring:'Khi đọc kết quả của bệnh nhân mang từ nơi khác đến, ghi rõ tên test và nền tảng vào hồ sơ.',
     vn:'Dùng bằng chứng này để tư vấn cho bệnh nhân đang được chào mời xét nghiệm máu chẩn đoán Alzheimer dịch vụ: hiệu năng rất khác nhau, và kết quả không thay thế đánh giá lâm sàng.',
     references:['Pahlke S, Kahale LA, Mahinrad S, và cộng sự. Blood-based biomarkers for detecting Alzheimer’s disease pathology in cognitively impaired individuals within specialized care settings: a systematic review and meta-analysis. Alzheimers Dement. 2025;21(11):e70828. PMID 41193403.']},

    {id:'ITEM-06', title:'Xét nghiệm máu p-tau217 vượt trội so với đánh giá lâm sàng đơn thuần (Thuỵ Điển)',
     source:'Blood Biomarkers to Detect Alzheimer Disease in Primary Care and Secondary Care', org:'JAMA', dateVersion:'2024 · JAMA 2024;332(15):1245-1257',
     pmid:'39068545', doi:'10.1001/jama.2024.13855', design:'Cohort',
     population:'1213 bệnh nhân có triệu chứng nhận thức tại tuyến ban đầu và tuyến chuyên khoa, Thuỵ Điển, 2020–2024',
     frame:'Chẩn đoán (PIRT)', frameLabels:{P:'P',I:'Index test',C:'Chuẩn tham chiếu',O:'Độ chính xác'},
     pico:{P:['Người có triệu chứng nhận thức tại tuyến ban đầu và chuyên khoa','match'],I:['%p-tau217 đơn thuần và điểm APS2 (kết hợp Aβ42/Aβ40), điểm cắt định trước','match'],C:['Bệnh học Alzheimer theo dịch não tuỷ (Aβ42/Aβ40 và p-tau217)','match'],O:['AUC 0,96–0,97; PPV và NPV 87–92%; độ chính xác 88–92%','match']},
     effectText:'Độ chính xác chẩn đoán: tuyến ban đầu 61% (53–69) → 91% (86–96) với APS2; chuyên khoa 73% (68–79) → 91% (88–95)',
     gradeSource:'Nghiên cứu độ chính xác chẩn đoán tiến cứu, điểm cắt xác định trước ở đoàn hệ độc lập; nguồn KHÔNG cung cấp phân hạng GRADE. Mức hiển thị = đánh giá vận hành',
     gradeLevel:'mod', decision:'consider', groups:['cao-tuoi'],
     action:'Hiệu số nguồn: bác sĩ tuyến ban đầu chẩn đoán đúng Alzheimer 61% (95% CI 53–69) sau khám lâm sàng, test nhận thức và CT sọ não, so với 91% (86–96) khi dùng APS2; bác sĩ chuyên khoa trí nhớ 73% (68–79) so với 91% (88–95). Thông điệp thực hành: khi CHƯA có dấu ấn sinh học, phải ý thức rõ giới hạn độ chính xác của chẩn đoán lâm sàng và thận trọng khi khẳng định nguyên nhân.',
     monitoring:'Ở nơi chưa có xét nghiệm, tăng độ tin cậy bằng theo dõi diễn tiến theo thời gian thay vì khẳng định nguyên nhân ngay lần khám đầu.',
     vn:'Chưa triển khai tại Việt Nam. Giá trị thực hành ngay: nhắc rằng chẩn đoán nguyên nhân bằng lâm sàng đơn thuần sai khoảng 1/3 số ca, nên nên diễn đạt với gia đình là “nhiều khả năng do Alzheimer” thay vì khẳng định tuyệt đối.',
     references:['Palmqvist S, Tideman P, Mattsson-Carlgren N, và cộng sự. Blood Biomarkers to Detect Alzheimer Disease in Primary Care and Secondary Care. JAMA. 2024;332(15):1245-1257. PMID 39068545.']},

    {id:'ITEM-07', title:'Thuốc ức chế cholinesterase (donepezil) — lợi ích NHỎ nhưng nhất quán',
     source:'Donepezil for dementia due to Alzheimer’s disease (Cochrane Review)', org:'Cochrane Database of Systematic Reviews', dateVersion:'2018 · CD001190.pub3',
     pmid:'29923184', doi:'10.1002/14651858.CD001190.pub3', design:'Meta',
     population:'30 nghiên cứu, 8257 người tham gia; Alzheimer nhẹ, trung bình hoặc nặng; phân tích chính donepezil 10 mg/ngày so với giả dược ở 24–26 tuần',
     pico:{P:['Sa sút trí tuệ do Alzheimer, mọi mức độ','match'],I:['Donepezil 10 mg/ngày','match'],C:['Giả dược','match'],O:['Nhận thức, hoạt động sống hằng ngày, ấn tượng lâm sàng toàn thể, hành vi','match']},
     effect:{measure:'OR (cải thiện toàn thể)', hr:1.92, lo:1.54, hi:2.39, ci:'1,54–2,39', favors:true},
     gradeSource:'Chứng cứ mức TRUNG BÌNH (moderate quality) theo đánh giá GRADE của chính tổng quan, hạ bậc do hạn chế thiết kế nghiên cứu',
     gradeLevel:'mod', decision:'apply', groups:['cao-tuoi','tim-mach','da-thuoc'],
     action:'Hiệu số nguồn (26 tuần, donepezil 10 mg so với giả dược): ADAS-Cog −2,67 (95% CI −3,31 đến −2,02); MMSE +1,05 (0,73–1,37); SIB +5,92 (4,53–7,31); ADCS-ADL bản nặng +1,03 (0,21–1,85); tỷ lệ cải thiện trên thang ấn tượng lâm sàng OR 1,92 (1,54–2,39). KHÔNG khác biệt về triệu chứng hành vi (NPI −1,62; −3,43 đến 0,19) và chất lượng sống. Liều 23 mg KHÔNG lợi hơn 10 mg nhưng nhiều tác dụng ngoại ý hơn.',
     monitoring:'Tác dụng ngoại ý 72% so với 65% (OR 1,59; 1,31–1,95); ngưng thuốc OR 1,25 (1,05–1,50). Theo dõi buồn nôn, chán ăn, sụt cân, tiêu chảy, nhịp tim chậm, ngất; hỏi về ngã. Đánh giá lại lợi ích sau 3–6 tháng cùng người chăm sóc.',
     vn:'Sẵn có, chi phí chấp nhận được. Thận trọng ở bệnh nhân nhịp chậm, block dẫn truyền, hội chứng nút xoang, đang dùng chẹn beta; và ở người có loét dạ dày–tá tràng hoặc hen/COPD nặng. Trao đổi trung thực với gia đình rằng lợi ích là NHỎ và không đảo ngược bệnh.',
     references:['Birks JS, Harvey RJ. Donepezil for dementia due to Alzheimer’s disease. Cochrane Database Syst Rev. 2018;6(6):CD001190. PMID 29923184.']},

    {id:'ITEM-08', title:'Memantine — CÓ lợi ở Alzheimer trung bình–nặng, KHÔNG lợi ở Alzheimer nhẹ',
     source:'Memantine for dementia (Cochrane Review)', org:'Cochrane Database of Systematic Reviews', dateVersion:'2019 · CD003154.pub6',
     pmid:'30891742', doi:'10.1002/14651858.CD003154.pub6', design:'Meta',
     population:'44 thử nghiệm, gần 10.000 người tham gia (29 thử nghiệm, 7885 người ở Alzheimer); phân tích ở liều được cấp phép, theo dõi 6–7 tháng',
     pico:{P:['Alzheimer trung bình–nặng (và riêng: Alzheimer nhẹ, sa sút trí tuệ mạch máu)','match'],I:['Memantine 20 mg/ngày hoặc 28 mg phóng thích kéo dài','match'],C:['Giả dược, có hoặc không kèm ức chế cholinesterase','match'],O:['Ấn tượng lâm sàng, nhận thức, hoạt động sống hằng ngày, hành vi–khí sắc','match']},

/* ============================ ENGINE (không cần sửa) ============================ */
const DESIGN_META={Guideline:['b-guideline','Guideline'],Meta:['b-meta','Meta-analysis'],RCT:['b-rct','RCT'],Cohort:['b-cohort','Cohort'],Consensus:['b-consensus','Đồng thuận']};
const GRADE_META={high:['g-high','Cao',4],mod:['g-mod','Trung bình',3],low:['g-low','Thấp',2],vlow:['g-vlow','Rất thấp',1],na:['g-na','Nguồn không phân hạng',0]};
const DEC_META={apply:['d-apply','Áp dụng ngay','--apply'],consider:['d-consider','Cân nhắc chọn lọc','--consider'],notyet:['d-notyet','Chưa đủ thay đổi','--notyet']};
const GROUP_META={'cao-tuoi':'Người cao tuổi','ckd':'CKD','gan':'Bệnh gan','dtd':'Đái tháo đường','tim-mach':'Tim mạch','da-thuoc':'Đa thuốc'};
const ROB_META={l:['rl','✓','Nguy cơ thấp'],s:['rs','!','Có lo ngại'],h:['rh','✕','Nguy cơ cao']};

let state={selected:null, tab:'cqv', q:'', filters:{decision:new Set(),group:new Set(),design:new Set(),grade:new Set()}};

/* forest helpers */
const FMIN=0.4, FMAX=2.0;
function lx(v){const a=Math.log(FMIN),b=Math.log(FMAX);return (Math.log(Math.min(Math.max(v,FMIN),FMAX))-a)/(b-a);}
function miniForest(e){
  if(!e||e.hr==null) return '<span style="color:var(--faint);font-size:10px">—</span>';
  const W=108,H=20,cx=W*lx(e.hr),clo=W*lx(e.lo),chi=W*lx(e.hi),x1=W*lx(1);
  const col=e.favors?'var(--g-high)':(e.favors===false?'var(--g-vlow)':'var(--muted)');
  return `<div class="mforest"><svg width="${W}" height="${H}">
    <line x1="${x1}" y1="2" x2="${x1}" y2="${H-2}" stroke="var(--line-2)" stroke-dasharray="2 2"/>
    <line x1="${clo}" y1="${H/2}" x2="${chi}" y2="${H/2}" stroke="${col}" stroke-width="2"/>
    <rect x="${cx-3}" y="${H/2-3}" width="6" height="6" fill="${col}" transform="rotate(45 ${cx} ${H/2})"/></svg></div>`;
}

/* header + summary + kpis */
function renderStatic(){

  document.getElementById('q-title').textContent=DATA.meta.question;

  const p=DATA.meta.pico||{};
  document.getElementById('pico-bar').innerHTML=
    `<span class="pico-chip"><b>P</b> ${p.P||''}</span><span class="pico-chip i"><b>I</b> ${p.I||''}</span>`+
    `<span class="pico-chip c"><b>C</b> ${p.C||''}</span><span class="pico-chip o"><b>O</b> ${p.O||''}</span>`;
  document.getElementById('updstamp').textContent='Cập nhật: '+(DATA.meta.updated||'');
  const s=DATA.summary||{};
  const li=a=>(a||[]).map(x=>`<li>${x}</li>`).join('')||'<li style="color:var(--faint)">—</li>';
  document.getElementById('summary').innerHTML=`
    <div class="scard concl"><div class="sh"><span class="ic">✓</span>Kết luận thực hành</div><p>${s.conclusion||'—'}</p></div>
    <div class="scard do"><div class="sh"><span class="ic">➤</span>Nên làm hiện nay</div><ul>${li(s.doNow)}</ul></div>
    <div class="scard dont"><div class="sh"><span class="ic">⊘</span>Không nên / giới hạn</div><ul>${li(s.dontDo)}</ul></div>
    <div class="scard flag"><div class="sh"><span class="ic">⚑</span>Cờ đỏ / chuyển tuyến</div><ul>${li(s.redFlags)}</ul></div>`;
  // GRADE Evidence-to-Decision: KHÔNG hiển thị ở băng đầu trang nữa (tránh ép chiều cao bảng);
  // thay vào đó hiển thị dưới dạng TAB ở khu giữa — xem etdView().
}
/* GRADE Evidence-to-Decision dưới dạng nội dung tab (gọn, không chiếm chiều cao đầu trang) */
function etdView(){
  const etd=DATA.etd; if(!etd) return '<div class="empty">Không có khối GRADE Evidence-to-Decision cho vấn đề này.</div>';
  const cell=(label,val,tag)=>`<div class="etd-c"><div class="l">${label}${tag==='src'?'<span class="src">nguồn</span>':tag==='op'?'<span class="op">vận hành</span>':''}</div><div class="v">${val||'—'}</div></div>`;
  return `<div class="etd" style="border-bottom:0">
      <div class="eh">⚖ GRADE Evidence-to-Decision <span class="note">hàng "nguồn" = từ chứng cứ đã xác minh · hàng "vận hành" = đánh giá của người tổng hợp</span></div>
      <div class="etd-grid">
        ${cell('Vấn đề ưu tiên',etd.problem,'op')}
        ${cell('Lợi ích mong muốn',etd.desirable,'src')}
        ${cell('Tác hại',etd.undesirable,'src')}
        ${cell('Độ chắc chắn',etd.certainty,'src')}
        ${cell('Giá trị/ưu tiên BN',etd.values,'op')}
        ${cell('Cân bằng lợi–hại',etd.balance,'op')}
        ${cell('Nguồn lực/chi phí',etd.resources,'op')}
        ${cell('Công bằng',etd.equity,'op')}
        ${cell('Chấp nhận',etd.acceptability,'op')}
        ${cell('Khả thi',etd.feasibility,'op')}
      </div>
      ${etd.recommendation?`<div class="etd-rec"><div class="rh">➤ Khuyến cáo (đánh giá vận hành)${etd.strength?`<span class="str">${etd.strength==='strong'?'Mạnh':'Có điều kiện'}</span>`:''}</div><div class="rv">${etd.recommendation}</div></div>`:''}
    </div>`;
}
function renderKPIs(){
  const it=DATA.items, c=k=>it.filter(x=>x.decision===k).length;
  const newest=it.map(x=>x.dateVersion).filter(Boolean).sort().slice(-1)[0]||'—';
  const kp=[
    {label:'Tổng điểm chứng cứ',val:it.length,sub:'item đã xác minh',cls:''},
    {label:'Áp dụng ngay',val:c('apply'),sub:'đủ xác minh',cls:'apply'},
    {label:'Cân nhắc chọn lọc',val:c('consider'),sub:'theo bối cảnh',cls:'consider'},
    {label:'Chưa đủ thay đổi',val:c('notyet'),sub:'tín hiệu/gián tiếp',cls:'notyet'},
    {label:'Nguồn mới nhất',val:newest,sub:'năm/phiên bản',cls:''},
  ];
  document.getElementById('kpis').innerHTML=kp.map(d=>`<div class="kpi"><div class="label">${d.label}</div><div class="val ${d.cls}">${d.val}</div><div class="sub">${d.sub}</div></div>`).join('');
}

/* facets */
function buildFacets(){
  const it=DATA.items;
  const cnt=(fn)=>{const m={};it.forEach(x=>{const v=fn(x);(Array.isArray(v)?v:[v]).forEach(k=>{if(k!=null&&k!=='')m[k]=(m[k]||0)+1;});});return m;};
  const dc=cnt(x=>x.decision);
  document.getElementById('f-decision').innerHTML=Object.keys(DEC_META).filter(k=>dc[k]).map(k=>opt('decision',k,DEC_META[k][1],dc[k],`background:var(${DEC_META[k][2]})`)).join('')||emptyF();
  const gc=cnt(x=>x.groups);
  document.getElementById('f-group').innerHTML=Object.keys(GROUP_META).filter(k=>gc[k]).map(k=>opt('group',k,GROUP_META[k],gc[k],'background:var(--accent)')).join('')||emptyF();
  const dsc=cnt(x=>x.design);
  document.getElementById('f-design').innerHTML=Object.keys(DESIGN_META).filter(k=>dsc[k]).map(k=>opt('design',k,DESIGN_META[k][1],dsc[k],`background:var(--${k==='Guideline'?'guideline':k==='Meta'?'meta':k==='RCT'?'rct':k==='Cohort'?'cohort':'consensus'})`)).join('')||emptyF();
  const grc=cnt(x=>x.gradeLevel);
  document.getElementById('f-grade').innerHTML=Object.keys(GRADE_META).filter(k=>grc[k]).map(k=>opt('grade',k,GRADE_META[k][1],grc[k],`background:var(--g-${k==='mod'?'mod':k==='vlow'?'vlow':k==='na'?'':k})`)).join('')||emptyF();
}
function emptyF(){return '<div style="font-size:11px;color:var(--faint);padding:4px 7px">—</div>';}
function opt(group,key,label,count,dotStyle){
  const on=state.filters[group].has(key)?'on':'';
  return `<div class="opt ${on}" onclick="toggleFacet('${group}','${key}')"><span class="box">${on?'✓':''}</span><span class="dot" style="${dotStyle}"></span><span class="nm">${label}</span><span class="ct">${count}</span></div>`;
}
function toggleFacet(g,k){const s=state.filters[g];s.has(k)?s.delete(k):s.add(k);buildFacets();render();}
function clearFacet(g){state.filters[g].clear();buildFacets();render();}

/* tabs */
function renderTabs(){
  const it=DATA.items;
  const nSafety=it.filter(x=>x.safety).length, nNot=it.filter(x=>x.decision==='notyet').length;
  const tabs=[['cqv','◧ Clinical Quick View',it.length]];
  if(DATA.etd) tabs.push(['etd','⚖ GRADE EtD','']);
  tabs.push(
    ['safety','⚑ An toàn & chuyển tuyến',nSafety],
    ['notyet','⊘ Chưa đủ thay đổi',nNot],
    ['vn','★ Áp dụng tại Việt Nam',it.length],
    ['verify','✓ Kiểm chứng thao tác',4]
  );
  document.getElementById('tabs').innerHTML=tabs.map(([k,l,n])=>`<button class="tab ${state.tab===k?'on':''}" onclick="setTab('${k}')">${l}${(n===''||n==null)?'':`<span class="badge-n">${n}</span>`}</button>`).join('');
}
function setTab(t){state.tab=t;renderTabs();renderCenter();}

/* filtering */
function filtered(){
  let arr=DATA.items.slice();const f=state.filters;
  if(f.decision.size)arr=arr.filter(x=>f.decision.has(x.decision));
  if(f.group.size)arr=arr.filter(x=>(x.groups||[]).some(g=>f.group.has(g)));
  if(f.design.size)arr=arr.filter(x=>f.design.has(x.design));
  if(f.grade.size)arr=arr.filter(x=>f.grade.has(x.gradeLevel));
  if(state.q){const q=state.q.toLowerCase();arr=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(q));}
  return arr;
}

/* center render */
function render(){state.q=document.getElementById('q').value.trim().toLowerCase();renderCenter();renderDetail();}
function renderCenter(){
  const host=document.getElementById('center-scroll');
  if(state.tab==='cqv') host.innerHTML=tableView(filtered());
  else if(state.tab==='etd') host.innerHTML=etdView();
  else if(state.tab==='safety') host.innerHTML=cardView(DATA.items.filter(x=>x.safety),'safety');
  else if(state.tab==='notyet') host.innerHTML=cardView(DATA.items.filter(x=>x.decision==='notyet'),'notyet');
  else if(state.tab==='vn') host.innerHTML=vnView();
  else if(state.tab==='verify') host.innerHTML=verifyView();
}
function tableView(arr){
  const rows=arr.map(e=>{
    const dm=DESIGN_META[e.design]||['',''], gm=GRADE_META[e.gradeLevel]||GRADE_META.na, dec=DEC_META[e.decision]||DEC_META.consider;
    const eff=e.effect
      ?`<span class="effect ${e.effect.favors?'fav':(e.effect.favors===false?'harm':'ns')}">${e.effect.hr!=null?e.effect.hr.toFixed(2):(e.effect.measure||'')}</span> <span class="ci">${e.effect.ci?'('+e.effect.ci+')':''}</span>`
      :(e.effectText?`<span class="efftext">${e.effectText}</span>`:'<span class="effect ns">—</span>');
    const pips=Array.from({length:4},(_,i)=>`<span class="pip ${i<gm[2]?'on':''}"></span>`).join('');
    return `<tr class="${e.id===state.selected?'sel':''}" onclick="select('${e.id}')">
      <td><span class="ttl">${e.title}<span class="auth">${e.source} · <span class="idtag">${e.id}</span>${e.pmid?` · PMID <span class="pmid">${e.pmid}</span>`:''}</span>${e.flag?`<span class="flag-mini">⚑ ${e.flag}</span>`:''}</span></td>
      <td><span class="badge ${dm[0]}"><span class="d"></span>${dm[1]}</span></td>
      <td>${eff}</td>
      <td>${miniForest(e.effect)}</td>
      <td><span class="grade ${gm[0]}"><span class="pips">${pips}</span>${gm[1]}</span></td>
      <td><span class="dec ${dec[0]}"><span class="d"></span>${dec[1]}</span></td>
    </tr>`;
  }).join('')||'<tr><td colspan="6" class="empty">Không có điểm chứng cứ khớp bộ lọc</td></tr>';
  return `<div class="ctoolbar"><span><b>${arr.length}</b> điểm chứng cứ · click để mở thẩm định</span><span class="sp"></span></div>
    <table><thead><tr><th>Điểm chứng cứ</th><th>Thiết kế</th><th>Hiệu số (nguồn)</th><th>Forest</th><th>Mức chứng cứ</th><th>Quyết định</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function cardView(arr,kind){
  if(!arr.length) return `<div class="empty">Không có nội dung cho mục này.</div>`;
  return `<div class="pad"><div class="cardlist">`+arr.map(e=>{
    const col=kind==='safety'?'var(--danger)':'var(--notyet)';
    const txt=kind==='safety'?e.safety:(e.action+(e.flag?` <span class="flag-mini">⚑ ${e.flag}</span>`:''));
    return `<div class="li-card" style="display:flex;gap:11px;cursor:pointer" onclick="select('${e.id}');setTab('cqv')">
      <div class="stripe" style="background:${col}"></div>
      <div><div class="h">${e.title}</div><div class="x">${txt}</div><div class="src">${e.source} · ${e.id}${e.pmid?' · PMID '+e.pmid:''}</div></div></div>`;
  }).join('')+`</div></div>`;
}
function vnView(){
  const apply=DATA.items.filter(x=>x.decision==='apply');
  const conf=DATA.items.filter(x=>(x.vn||'').includes('[CẦN XÁC NHẬN'));
  const row=e=>`<div class="li-card" style="cursor:pointer" onclick="select('${e.id}');setTab('cqv')"><div class="h" style="font-size:12.5px">${e.title}</div><div class="x">${e.vn||'—'}</div><div class="src">${e.source} · ${e.id}</div></div>`;
  return `<div class="pad"><div class="vn-grid">
    <div class="vn-col"><h5>✓ Triển khai ngay tại phòng khám</h5><div class="cardlist">${apply.map(row).join('')||'<div class="empty">—</div>'}</div></div>
    <div class="vn-col"><h5>⚙ Cần đối chiếu sẵn có · chi phí · BHYT · phác đồ</h5><div class="cardlist">${DATA.items.filter(x=>x.decision==='consider').map(row).join('')||'<div class="empty">—</div>'}</div>
      ${conf.length?`<h5 style="margin-top:14px">⚐ Cần xác nhận tại đơn vị</h5><div class="cardlist">${conf.map(row).join('')}</div>`:''}</div>
  </div></div>`;
}
function verifyView(){
  const tasks=[
    ['1','Tìm hành động ưu tiên của vấn đề','Mở tab Clinical Quick View → cột "Quyết định = Áp dụng ngay".','≤ 30s'],
    ['2','Tìm cờ đỏ / chuyển tuyến','Băng tóm tắt phía trên → thẻ "Cờ đỏ / chuyển tuyến".','≤ 30s'],
    ['3','Tìm nội dung cho nhóm đặc biệt','Bộ lọc trái → "Nhóm đặc biệt" (CKD, người cao tuổi…).','≤ 30s'],
    ['4','Mở nguồn & ngày/phiên bản','Click một điểm → panel phải → mục "Nguồn & truy xuất".','≤ 60s'],
  ];
  return `<div class="pad"><div class="cardlist">`+tasks.map(([n,t,g,tm])=>`<div class="vtask"><div class="n">${n}</div><div><div class="t">${t}</div><div class="g">${g}</div></div><div class="timer">${tm}</div></div>`).join('')+`</div></div>`;
}

/* detail (Lớp 2) */
function select(id){state.selected=id;if(state.tab!=='cqv'){state.tab='cqv';renderTabs();renderCenter();}renderCenter();renderDetail();openDrawer();}
function openDrawer(){document.getElementById('detail').classList.add('open');document.getElementById('scrim').classList.add('open');}
function closeDetail(){document.getElementById('detail').classList.remove('open');document.getElementById('scrim').classList.remove('open');}
function renderDetail(){
  const el=document.getElementById('detail');
  const e=DATA.items.find(x=>x.id===state.selected);
  if(!e){el.innerHTML='<div class="empty">Chọn một điểm chứng cứ để xem thẩm định chi tiết<br><span style="font-size:11px">(Evidence Detail View)</span></div>';return;}
  const dm=DESIGN_META[e.design]||['',''], gm=GRADE_META[e.gradeLevel]||GRADE_META.na, dec=DEC_META[e.decision]||DEC_META.consider;
  const pips=Array.from({length:4},(_,i)=>`<span class="pip ${i<gm[2]?'on':''}"></span>`).join('');
  const FL=e.frameLabels||{P:'P',I:'I',C:'C',O:'O'};
  const picoRows=['P','I','C','O'].map(k=>{const d=(e.pico||{})[k]||['—','match'];return `<div class="k k${k}">${FL[k]||k}</div><div class="v">${d[0]} ${d[1]==='match'?'<span class="match">✓ khớp</span>':'<span class="mis">⚠ lệch</span>'}</div>`;}).join('');
  const eff=e.effect;
  const statsHtml=eff?`<div class="dsec"><h3>∑ Hiệu số (đúng như nguồn báo cáo)</h3><div class="stats">
      <div class="stat"><div class="l">${eff.measure||'Hiệu số'}</div><div class="n" style="color:${eff.favors?'var(--g-high)':'var(--ink)'}">${eff.hr!=null?eff.hr.toFixed(2):'—'}</div><div class="x">95% CI ${eff.ci||'—'}</div></div>
      <div class="stat"><div class="l">Forest</div><div style="margin-top:6px">${miniForest(eff)}</div><div class="x">ngưỡng 1.0</div></div>
    </div></div>`
    :(e.effectText?`<div class="dsec"><h3>∑ Hiệu số (đúng như nguồn báo cáo)</h3>
      <p style="font-size:12px;color:var(--ink);line-height:1.5">${e.effectText}</p>
      <p style="font-size:10px;color:var(--muted);margin-top:5px">Hiệu số phi-tỷ-số — không vẽ forest vì mốc vô hiệu là 0, không phải 1,0.</p>
    </div>`:'');
  const robHtml=e.rob?`<div class="dsec"><h3>◔ Nguy cơ sai lệch (RoB 2)<span class="needconf" style="margin-left:6px">đánh giá vận hành</span></h3>
    <p style="font-size:10px;color:var(--muted);margin:-4px 0 8px">Chấm theo RoB 2 bởi người tổng hợp, KHÔNG phải phân hạng của nguồn. Chỉ điền khi đã đọc đủ phương pháp; để trống thì tốt hơn là đoán.</p><div class="robfull">
      ${Object.keys(e.rob).map(d=>{const r=ROB_META[e.rob[d]]||ROB_META.s;return `<div class="r"><span>${d}</span><i class="${r[0]}" title="${r[2]}">${r[1]}</i></div>`;}).join('')}
    </div></div>`:'';
  el.innerHTML=`
    <div class="dhead">
      <button class="detail-close" onclick="closeDetail()" title="Đóng">✕</button>
      <div class="deyebrow">⊕ Evidence Detail · ${e.id}${e.frame?' · Khung '+e.frame:''}</div>
      <h2>${e.title}</h2>
      <div class="dmeta">
        <span class="badge ${dm[0]}"><span class="d"></span>${dm[1]}</span>
        <span class="grade ${gm[0]}"><span class="pips">${pips}</span>${gm[1]}</span>
        <span class="dec ${dec[0]}"><span class="d"></span>${dec[1]}</span>
      </div>
    </div>
    <div class="dsec"><h3>📄 Nguồn</h3><div class="kvline">
      <div class="r"><span class="k">Tài liệu</span><span class="v">${e.source}</span></div>
      <div class="r"><span class="k">Tổ chức</span><span class="v">${e.org||'—'}</span></div>
      <div class="r"><span class="k">Ngày/phiên bản</span><span class="v">${e.dateVersion||'—'}</span></div>
      <div class="r"><span class="k">Quần thể</span><span class="v">${e.population||'—'}</span></div>
      <div class="r"><span class="k">Grading nguồn</span><span class="v">${e.gradeSource||'Nguồn không cung cấp phân hạng'}</span></div>
    </div></div>
    <div class="dsec"><h3>◧ Đối chiếu ${e.frame||'PICO'}</h3><div class="picogrid">${picoRows}</div></div>
    ${statsHtml}
    ${robHtml}
    <div class="dsec"><h3>➤ Hành động & theo dõi</h3><div class="kvline">
      <div class="r"><span class="k">Hành động</span><span class="v">${e.action||'—'}</span></div>
      <div class="r"><span class="k">Monitoring</span><span class="v">${e.monitoring||'—'}</span></div>
      <div class="r"><span class="k">Nhóm liên quan</span><span class="v">${(e.groups||[]).map(g=>GROUP_META[g]||g).join(', ')||'—'}</span></div>
    </div></div>
    ${e.safety?`<div class="dsec"><h3>⚑ An toàn / chuyển tuyến</h3><p style="font-size:12px;color:var(--ink-2);line-height:1.5">${e.safety}</p></div>`:''}
    <div class="dsec"><h3>★ Áp dụng tại Việt Nam</h3><div class="applybox"><div class="ah">💡 ${dec[1]}</div><p>${e.vn||'—'}</p></div></div>
    <div class="dsec"><h3>🔗 Nguồn & truy xuất</h3><div class="src">
      ${e.pmid?`<a href="https://pubmed.ncbi.nlm.nih.gov/${e.pmid}/" target="_blank"><span class="tag pmid">PMID</span> ${e.pmid} · PubMed</a>`:''}
      ${e.doi?`<a href="https://doi.org/${e.doi}" target="_blank"><span class="tag doi">DOI</span> ${e.doi}</a>`:''}
      ${e.url?`<a href="${e.url}" target="_blank"><span class="tag url">URL</span> Mở nguồn</a>`:''}
    </div></div>
    ${(e.references&&e.references.length)?`<div class="dsec"><h3>📚 Tài liệu tham khảo (Vancouver/NLM)</h3><div class="reflist">${e.references.map(r=>`<div class="r">${r}</div>`).join('')}</div></div>`:''}`;
}

/* export */
function exportData(fmt){
  const arr=filtered();
  if(fmt==='json'){download('dashboard-ebm.json',JSON.stringify({meta:DATA.meta,items:arr},null,2),'application/json');return;}
  const cols=['id','title','design','decision','gradeSource','population','source','dateVersion','pmid','doi','action','monitoring','vn'];
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const rows=[cols.join(',')].concat(arr.map(e=>cols.map(c=>esc(e[c])).join(',')));
  download('dashboard-ebm.csv','﻿'+rows.join('\n'),'text/csv');
}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href);}

/* init */
renderStatic();renderKPIs();buildFacets();renderTabs();render();
</script>
</body>
</html>
